api:
  dashboard: true
  insecure: false

providers:
  docker:
    endpoint: "tcp://socket-proxy-ro:2375"
    watch: true
    exposedByDefault: false
    network: homelab_web
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt-staging
        domains:
          - main: "example.com"
  dashboard:
    address: ":8080"

certificatesResolvers:
  letsencrypt-staging:
    acme:
      email: "admin@example.com"
      storage: "/letsencrypt/acme-staging.json"
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
  letsencrypt-production:
    acme:
      email: "admin@example.com"
      storage: "/letsencrypt/acme-production.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  filePath: "/var/log/traefik/traefik.log"
  format: "json"
  level: DEBUG

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: "json"
  filters:
    statusCodes:
      - "200"
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"
  bufferingSize: 100
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
