services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: hawser
    hostname: hawser
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - /opt/homelab/docker/hawser/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/homelab/stacks:/opt/homelab/stacks
      - /opt/homelab/docker/.env:/opt/homelab/docker/.env:ro
    networks:
      - homelab_socket

networks:
  homelab_socket:
    external: true
