services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    hostname: dockhand
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - /opt/homelab/docker/dockhand/.env
    ports:
      - "8085:3000"
    volumes:
      # Estado interno de dockhand: db, .encryption_key y git-repos/.
      - ${STACK_DIR}/data:/app/data
      # Recetas que crea dockhand. Respeta su estructura impuesta
      # {DATA_DIR}/stacks/{env}/{stack} → en el host /opt/homelab/stacks/{env}/{stack}.
      # Mismo dir que el de hawser (dockhand escribe, hawser ejecuta).
      # Ruta fija: el .env global no se interpola en el compose.
      - /opt/homelab/stacks:/app/data/stacks
    networks:
      - homelab_web
      - homelab_socket

networks:
  homelab_web:
    external: true
  homelab_socket:
    external: true