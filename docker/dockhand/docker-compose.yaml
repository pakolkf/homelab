services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    hostname: dockhand
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - /opt/homelab/docker/dockhand/.env
    ports:
      - "8085:3000"
    volumes:
      # Datos internos de dockhand (db, .encryption_key, git-repos/, copia
      # central de stacks). Ruta fija en appdata (el .env global no se interpola).
      - /opt/homelab/appdata/dockhand:/app/data
    networks:
      - homelab_web
      - homelab_socket

networks:
  homelab_web:
    external: true
  homelab_socket:
    external: true