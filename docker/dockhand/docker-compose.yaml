services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    hostname: dockhand
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - /opt/homelab/docker/dockhand/.env
    ports:
      - "8085:3000"
    volumes:
      # Estado interno de dockhand: db, .encryption_key, git-repos/ y la copia
      # CENTRAL de los stacks ({env}/{stack}). El runtime lo ejecuta hawser desde
      # su STACKS_DIR (/opt/homelab/stacks); ese dir NO se monta aquí (si se
      # montara, colisionaría con la copia plana de hawser en el mismo path).
      - ${STACK_DIR}/data:/app/data
    networks:
      - homelab_web
      - homelab_socket

networks:
  homelab_web:
    external: true
  homelab_socket:
    external: true