http:
  routers:
    qbittorrent:
      rule: "Host(`qbittorrent.${FQDN}`)"
      entryPoints:
        - websecure
      service: qbittorrent
      middlewares:
        - secure-headers
        - error-pages
      tls: {}

  services:
    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://qbittorrent:8080"
