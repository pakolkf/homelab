http:
  routers:
    traefik-dashboard:
      rule: "Host(`traefik.${FQDN}`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - secure-headers
        - error-pages

    traefik-dashboard-ip:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - dashboard
      service: api@internal
      middlewares:
        - secure-headers
        - error-pages
