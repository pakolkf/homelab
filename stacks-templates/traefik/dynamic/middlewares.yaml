http:
  middlewares:
    error-pages:
      errors:
        # NO interceptar 401: lleva la cabecera WWW-Authenticate del reto Basic
        # Auth (p.ej. transmission). Si se intercepta, el navegador no recibe el
        # reto y no puede loguearse. Por eso el rango omite el 401.
        status:
          - "400"
          - "402-599"
        service: error-pages
        query: "/{status}.html"

    secure-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: "frame-ancestors 'self' https://*.${FQDN}"
