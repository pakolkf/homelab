http:
  routers:
    dockhand:
      rule: "Host(`dockhand.${FQDN}`)"
      entryPoints:
        - websecure
      service: dockhand
      middlewares:
        - secure-headers
        - error-pages
      tls: {}

  services:
    dockhand:
      loadBalancer:
        servers:
          - url: "http://dockhand:3000"
