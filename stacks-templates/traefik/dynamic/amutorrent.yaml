http:
  routers:
    amutorrent:
      rule: "Host(`amutorrent.${FQDN}`)"
      entryPoints:
        - websecure
      service: amutorrent
      middlewares:
        - secure-headers
        - error-pages
      tls: {}

  services:
    amutorrent:
      loadBalancer:
        servers:
          - url: "http://amutorrent:4000"
