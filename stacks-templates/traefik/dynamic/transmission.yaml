http:
  routers:
    transmission:
      rule: "Host(`transmission.${FQDN}`)"
      entryPoints:
        - websecure
      service: transmission
      middlewares:
        - secure-headers
        - error-pages
      tls: {}

  services:
    transmission:
      loadBalancer:
        servers:
          - url: "http://transmission:9091"
