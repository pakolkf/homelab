services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/config:/config
      - ${APPDATA_DIR}/backups:/backups
      - /opt/homelab:/source:ro
    networks:
      - homelab_web

networks:
  homelab_web:
    external: true
