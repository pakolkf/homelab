services:
  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/radarr/config:/config
      - ${APPDATA_DIR}/radarr/backup:/backup
      - ${MEDIA_DIR}:/data_arr
    networks:
      - homelab_web

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/sonarr/config:/config
      - ${APPDATA_DIR}/sonarr/backup:/backup
      - ${MEDIA_DIR}:/data_arr
    networks:
      - homelab_web

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/bazarr/config:/config
      - ${APPDATA_DIR}/bazarr/backup:/backup
      - ${MEDIA_DIR}:/data_arr
    networks:
      - homelab_web

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    hostname: profilarr
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    environment:
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
      - ORIGIN=https://profilarr.${FQDN}
    volumes:
      - ${APPDATA_DIR}/profilarr/config:/config
    networks:
      - homelab_web
      - profilarr_internal
    depends_on:
      profilarr-parser:
        condition: service_healthy

  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest
    container_name: profilarr-parser
    hostname: profilarr-parser
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    networks:
      - profilarr_internal

networks:
  homelab_web:
    external: true
  profilarr_internal:
    driver: bridge
    internal: true