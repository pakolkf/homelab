services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    stop_grace_period: "10s"
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/qbittorrent/config:/config
      - ${MEDIA_DIR}:/data_arr
    ports:
      - 6881:6881
      - 6881:6881/udp
    networks:
      - homelab_web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    hostname: transmission
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/transmission/config:/config
      - ${MEDIA_DIR}:/data_arr
    ports:
      - 51413:51413
      - 51413:51413/udp
    networks:
      - homelab_web
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://localhost:9091/transmission/web/ | grep -qE '^(200|401|409)$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  amule:
    image: ngosang/amule
    container_name: amule
    hostname: amule
    stop_grace_period: "30s"
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    ports:
      - 4662:4662
      - 4665:4665/udp
      - 4672:4672/udp
    volumes:
      - ${APPDATA_DIR}/amule/config:/home/amule/.aMule
      - ${MEDIA_DIR}:/data_arr
    networks:
      - homelab_web
    healthcheck:
      test: ["CMD-SHELL", "pgrep amuled >/dev/null && grep -q ':1268 .* 0A ' /proc/net/tcp"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 45s

  amutorrent:
    image: g0t3nks/amutorrent:latest
    container_name: amutorrent
    hostname: amutorrent
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/amutorrent/logs:/usr/src/app/server/logs
      - ${APPDATA_DIR}/amutorrent/config:/usr/src/app/server/data
      - ${APPDATA_DIR}/amule:/home/amule
      - ${MEDIA_DIR}:/data_arr
    networks:
      - homelab_web
    depends_on:
      amule:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      transmission:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 4000) + '/health', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  homelab_web:
    external: true