services:
  wgdashboard:
    image: ghcr.io/wgdashboard/wgdashboard:latest
    container_name: wgdashboard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    env_file:
      - /opt/homelab/docker/.env
      - .env
    ports:
      - 51820:51820/udp
    volumes:
      - ${APPDATA_DIR}/conf:/etc/wireguard
      - ${APPDATA_DIR}/data:/data
    networks:
      - homelab_web

networks:
  homelab_web:
    external: true
