services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ${APPDATA_DIR}/root.hints:/opt/unbound/etc/unbound/root.hints:ro
      - ${APPDATA_DIR}/root.key:/opt/unbound/etc/unbound/root.key:ro
    networks:
      - homelab_dns
    healthcheck:
      # klutchell/unbound es FROM scratch: no hay /bin/sh ni 'drill'. Cualquier
      # healthcheck con shell/binario externo falla ("exec /bin/sh: not found").
      # Lo deshabilitamos (NONE).
      test: ["NONE"]

networks:
  homelab_dns:
    external: true