services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      # Config custom en el include dir de klutchell (su base lo incluye).
      - ${APPDATA_DIR}/unbound.conf:/etc/unbound/custom.conf.d/unbound.conf:ro
      # Gestionamos NOSOTROS las raíces (montadas + cron mensual), no las de la
      # imagen. La config custom las referencia (root-hints + trust-anchor-file).
      - ${APPDATA_DIR}/root.hints:/etc/unbound/root.hints:ro
      - ${APPDATA_DIR}/root.key:/etc/unbound/root.key:ro
    networks:
      - homelab_dns

networks:
  homelab_dns:
    external: true