services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      # Config custom en el include dir de klutchell (su base la incluye y ya
      # gestiona root.hints/root.key/DNSSEC). NO sobrescribir unbound.conf.
      - ${APPDATA_DIR}/unbound.conf:/etc/unbound/custom.conf.d/unbound.conf:ro
    networks:
      - homelab_dns
    healthcheck:
      # klutchell/unbound es FROM scratch: no hay /bin/sh ni 'drill'. Cualquier
      # healthcheck con shell/binario externo falla ("exec /bin/sh: not found").
      # Lo deshabilitamos (NONE).
      test: ["NONE"]

networks:
  homelab_dns:
    external: true