services:
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - /opt/homelab/docker/unbound/.env
    volumes:
      - ${APPDATA_DIR}/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ${APPDATA_DIR}/root.hints:/opt/unbound/etc/unbound/root.hints:ro
      - ${APPDATA_DIR}/root.key:/opt/unbound/etc/unbound/root.key:ro
    networks:
      - homelab_dns
    healthcheck:
      test: ["CMD-SHELL", "drill @127.0.0.1 -p 5335 iana.org > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  homelab_dns:
    external: true