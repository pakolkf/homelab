services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      # Config custom (la base la incluye vía include-toplevel custom.conf.d/*.conf).
      - ${APPDATA_DIR}/unbound.conf:/etc/unbound/custom.conf.d/unbound.conf:ro
      # Raíces gestionadas por NOSOTROS: montamos el DIRECTORIO entero sobre
      # /var/unbound (donde la base de klutchell resuelve root.hints/root.key, rutas
      # relativas). Montar los ficheros SUELTOS no vale: unbound actualiza el ancla
      # con rename(tmp -> root.key) y sobre un bind-mount de fichero da
      # "rename: Resource busy"; con el dir, el rename queda dentro del mismo mount.
      # NO declaramos root-hints/trust-anchor-file en la conf (la base ya lo hace;
      # duplicar da "presented twice"). Persisten entre recreates sin rebuild; el cron
      # mensual las refresca. El dir debe ser 101:102 (lo hace fix_permissions) para
      # que unbound pueda escribir/renombrar root.key.
      - ${APPDATA_DIR}:/var/unbound
    networks:
      - homelab_dns

networks:
  homelab_dns:
    external: true