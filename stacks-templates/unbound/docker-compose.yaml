services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      # Solo la config custom. klutchell ya gestiona root.hints y el ancla DNSSEC
      # (auto-trust-anchor-file/RFC5011) en su base; montar/definir las nuestras
      # choca ("trust anchor presented twice") y unbound no arranca.
      - ${APPDATA_DIR}/unbound.conf:/etc/unbound/custom.conf.d/unbound.conf:ro
    networks:
      - homelab_dns

networks:
  homelab_dns:
    external: true