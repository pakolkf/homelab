server:

    # =========================
    # REGISTRO DE ACTIVIDAD
    # =========================
    # Sin logfile: va a stderr -> docker logs (mejor en contenedor).
    verbosity: 1
    log-queries: no
    log-replies: no
    statistics-interval: 0
    use-syslog: no

    # =========================
    # INTERFACE Y PUERTO
    # =========================
    # La interface (0.0.0.0) ya la define la base de klutchell; aquí solo el
    # puerto (se aplica a esa interface). Repetir 'interface: 0.0.0.0' da
    # "present twice, cannot bind same ports twice".
    port: 5335

    # =========================
    # PROTOCOLOS (IPv4, sin IPv6)
    # =========================
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    prefer-ip4: yes
    prefer-ip6: no

    # =========================
    # SEGURIDAD Y PRIVACIDAD
    # =========================
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    deny-any: yes                       # ignora queries ANY (anti-amplificación)
    unwanted-reply-threshold: 10000000  # mitiga envenenamiento de caché
    target-fetch-policy: "3 2 1 0 0"
    qname-minimisation: yes
    aggressive-nsec: yes
    rrset-roundrobin: yes
    minimal-responses: yes

    # =========================
    # DNSSEC
    # =========================
    module-config: "validator iterator"
    trust-anchor-signaling: yes
    val-clean-additional: yes
    val-log-level: 1
    # NO declarar root-hints ni trust-anchor-file aquí: la base de klutchell ya
    # los define (rutas relativas -> /var/unbound/{root.hints,root.key}). Nosotros
    # gestionamos las raíces SOBRESCRIBIENDO esos ficheros con bind-mount en el
    # compose (no duplicando la directiva, que daría "presented twice"). El ancla
    # la mantiene unbound (auto-trust-anchor-file/RFC5011); el cron refresca hints.

    # =========================
    # RENDIMIENTO Y CACHÉ
    # =========================
    num-threads: 4
    msg-cache-size: 50m
    rrset-cache-size: 100m
    cache-max-ttl: 86400
    cache-min-ttl: 3600
    cache-max-negative-ttl: 3600
    cache-min-negative-ttl: 300
    edns-buffer-size: 1232
    prefetch: yes
    prefetch-key: yes
    # Buffers de socket (mejoran el rendimiento bajo carga). Descomenta SOLO si
    # subes net.core.rmem_max / wmem_max a >=4m; si no, unbound avisa y usa el máx.
    # so-rcvbuf: 4m
    # so-sndbuf: 4m

    # =========================
    # CONTROL DE ACCESO
    # =========================
    # Set amplio RFC1918: soporta cualquier LAN privada y la red docker (172.x)
    # sin reconfigurar al cambiar de red. (OJO: la red docker homelab_dns es
    # 172.20.x -> debe estar permitida, por eso 172.16.0.0/12.)
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # =========================
    # ANTI DNS-REBINDING (RFC1918 + link-local + ULA)
    # =========================
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Tu dominio público con split-horizon (permite IPs privadas en respuestas)
    private-domain: "${FQDN}"
    domain-insecure: "${FQDN}"
