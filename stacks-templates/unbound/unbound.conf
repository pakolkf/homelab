server:
    verbosity: 1
    log-queries: no
    log-replies: no
    statistics-interval: 0
    use-syslog: no

    interface: 0.0.0.0
    port: 5335

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    prefer-ip4: yes
    prefer-ip6: no

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    target-fetch-policy: "3 2 1 0 0"
    use-caps-for-id: yes
    qname-minimisation: yes
    aggressive-nsec: yes

    trust-anchor-file: "/etc/unbound/root.key"
    val-log-level: 1

    num-threads: 4
    msg-cache-size: 50m
    rrset-cache-size: 100m
    cache-max-ttl: 86400
    cache-min-ttl: 3600
    cache-max-negative-ttl: 3600
    cache-min-negative-ttl: 300
    edns-buffer-size: 1232
    prefetch: yes
    module-config: "validator iterator"

    root-hints: "/etc/unbound/root.hints"

    # ACCESS-CONTROL: que IPs origen pueden preguntarme.
    # Set amplio RFC1918 para soportar cualquier LAN privada sin reconfigurar
    # cuando cambia la red (192.168.1.0/24, 192.168.0.0/24, 10.55.0.0/24, etc.).
    # Tu LAN actual (10.55.0.0/24) ya cae dentro de uno de estos rangos.
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # PRIVATE-ADDRESS: anti DNS-rebinding (RFC1918 + link-local + ULA)
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Tu dominio publico con split-horizon (permite IPs privadas en respuestas)
    private-domain: "${FQDN}"
    domain-insecure: "${FQDN}"

# Control socket interno al container. Uso desde el host:
#   sudo docker exec unbound unbound-control stats
#   sudo docker exec unbound unbound-control reload
#   sudo docker exec unbound unbound-control flush_zone <dominio>
remote-control:
    control-enable: yes
    control-interface: /var/run/unbound/unbound.ctl
