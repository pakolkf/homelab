services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/data:/app/data
    networks:
      - homelab_web

networks:
  homelab_web:
    external: true
