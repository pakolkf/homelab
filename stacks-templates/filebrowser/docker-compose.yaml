services:
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    ports:
      - "8088:80"
    volumes:
      - /opt/homelab:/srv
      - ${APPDATA_DIR}/database:/database
      - ${APPDATA_DIR}/config:/config
    networks:
      - homelab_web

networks:
  homelab_web:
    external: true
