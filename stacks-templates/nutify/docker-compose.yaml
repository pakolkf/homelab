services:
  nutify:
    image: dartsteven/nutify:latest-amd64
    container_name: nutify
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - ${APPDATA_DIR}/data:/app/nutify/data
      - ${APPDATA_DIR}/logs:/app/nutify/logs
    networks:
      - homelab_web

networks:
  homelab_web:
    external: true
