services:
  socket-proxy-ro:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy-ro
    hostname: socket-proxy-ro
    restart: unless-stopped
    env_file:
      - /opt/homelab/docker/.env
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab_socket
    read_only: true
    tmpfs:
      - /run

networks:
  homelab_socket:
    external: true